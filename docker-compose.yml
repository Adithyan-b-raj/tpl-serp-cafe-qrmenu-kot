version: '3.8'
services:
  app:
    image: tastyigniter/tastyigniter:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - BRAND_NAME=ROAST & CO. BISTRO
      - PRIMARY_COLOR=#D97706
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bmad
      - POSTGRES_PASSWORD=bmad_secret
      - POSTGRES_DB=tpl_serp_cafe_qrmenu_kot
